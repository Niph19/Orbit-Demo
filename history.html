<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change History — Orbit</title>
    <meta name="description" content="Audit log of changes made across documents, finances, and member records." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="app-shell">
      <div id="page-content" class="space-y-6">
        <!-- Filter Toolbar -->
        <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <div>
            <h2 class="text-base font-semibold text-slate-900">Activity &amp; Change Log</h2>
            <p class="text-xs text-slate-500 mt-0.5">Every document upload, finance entry, and member update is automatically recorded here.</p>
          </div>
          <div class="flex items-center gap-3 shrink-0">
            <select
              id="history-section-filter"
              aria-label="Filter by section"
              class="h-10 px-3 text-sm font-medium text-slate-700 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#3B5BDB] cursor-pointer"
            >
              <option value="All">All Sections</option>
              <option value="Documents">Documents</option>
              <option value="Finance">Finance</option>
              <option value="Members">Members</option>
            </select>
          </div>
        </section>

        <!-- History Table -->
        <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="px-5 py-3.5 border-b border-slate-200 flex items-center justify-between gap-4">
            <p id="history-count-label" class="text-xs font-medium text-slate-500 tabular-nums"></p>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-slate-200 bg-slate-50/70 text-xs font-semibold text-slate-500">
                  <th class="py-3 px-5 whitespace-nowrap">Who</th>
                  <th class="py-3 px-4">What Changed</th>
                  <th class="py-3 px-4 whitespace-nowrap">Section</th>
                  <th class="py-3 px-4 whitespace-nowrap">Role</th>
                  <th class="py-3 px-5 whitespace-nowrap text-right">Time</th>
                </tr>
              </thead>
              <tbody id="history-table-body" class="divide-y divide-slate-100 text-sm"></tbody>
            </table>
          </div>

          <div id="history-empty-state" class="hidden py-14 px-6 text-center">
            <div class="w-11 h-11 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
              <i data-lucide="history" class="w-5 h-5"></i>
            </div>
            <h3 class="text-sm font-semibold text-slate-900">No history entries in this section</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">
              Switch the section filter or make an edit as Secretary or Treasurer to see new entries appear here.
            </p>
            <button
              type="button"
              id="history-clear-btn"
              class="mt-4 px-3.5 py-2 text-xs font-medium text-[#3B5BDB] bg-[#EEF2FF] rounded-lg hover:bg-[#DBE4FF] transition-colors"
            >
              Show all sections
            </button>
          </div>
        </section>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      (function () {
        var selectedSection = 'All';

        function renderHistory() {
          var state = OrbitApp.getState();
          var filtered = state.history.filter(function (item) {
            return selectedSection === 'All' || item.section === selectedSection;
          });

          document.getElementById('history-count-label').textContent =
            'Showing ' + filtered.length + ' of ' + state.history.length + ' recorded changes';

          var tbody = document.getElementById('history-table-body');
          var emptyEl = document.getElementById('history-empty-state');

          if (filtered.length === 0) {
            tbody.innerHTML = '';
            emptyEl.classList.remove('hidden');
          } else {
            emptyEl.classList.add('hidden');
            tbody.innerHTML = filtered
              .map(function (item) {
                var sectionClass = 'text-slate-700';
                if (item.section === 'Documents') sectionClass = 'text-[#3B5BDB] font-medium';
                else if (item.section === 'Finance') sectionClass = 'text-amber-700 font-medium';
                else if (item.section === 'Members') sectionClass = 'text-emerald-700 font-medium';

                return (
                  '<tr class="hover:bg-slate-50 transition-colors">' +
                  '  <td class="py-3.5 px-5 font-medium text-slate-900 whitespace-nowrap">' + OrbitApp.escapeHtml(item.actor) + '</td>' +
                  '  <td class="py-3.5 px-4 text-slate-700 min-w-[260px]">' + OrbitApp.escapeHtml(item.action) + '</td>' +
                  '  <td class="py-3.5 px-4 whitespace-nowrap ' + sectionClass + '">' + OrbitApp.escapeHtml(item.section) + '</td>' +
                  '  <td class="py-3.5 px-4 text-slate-600 whitespace-nowrap">' + OrbitApp.escapeHtml(item.role) + '</td>' +
                  '  <td class="py-3.5 px-5 text-slate-500 whitespace-nowrap text-right tabular-nums">' + OrbitApp.escapeHtml(item.time) + '</td>' +
                  '</tr>'
                );
              })
              .join('');
          }

          OrbitApp.refreshIcons();
        }

        if (OrbitApp.renderLayout({
          pageTitle: 'Change History',
          activeNav: 'history',
          onStateChange: renderHistory
        })) {
          document.getElementById('history-section-filter').addEventListener('change', function (e) {
            selectedSection = e.target.value;
            renderHistory();
          });

          document.getElementById('history-clear-btn').addEventListener('click', function () {
            selectedSection = 'All';
            document.getElementById('history-section-filter').value = 'All';
            renderHistory();
          });

          renderHistory();
        }
      })();
    </script>
  </body>
</html>
